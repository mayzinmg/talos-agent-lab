[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "talos-agent-lab"
version = "0.1.0"
description = "A mythology-inspired journey into Agentic AI."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "May Zin" }
]
dependencies = [
    "agent-framework-core==1.13.0",
    "agent-framework-openai==1.12.0",
    "python-dotenv==1.2.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
